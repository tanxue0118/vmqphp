<script type="text/javascript">
    function getObjectURL(file) {
        var url = null;
        if (window.createObjectURL != undefined) {
            url = window.createObjectURL(file);
        } else if (window.URL != undefined) {
            url = window.URL.createObjectURL(file);
        } else if (window.webkitURL != undefined) {
            url = window.webkitURL.createObjectURL(file);
        }
        return url;
    }

    // 页面缓存加载：首次拉取后缓存，再次点击秒开
    window.__pageCache = {};
    window.__loadPage = function (url, key) {
        key = key || url;
        var preview = $("#LAY_preview");
        preview.html('<div style="padding:60px;text-align:center;color:#86868b;font-size:14px;">加载中...</div>');
        if (window.__pageCache[key]) {
            preview.html(window.__pageCache[key]);
            return;
        }
        $.ajax({
            url: url,
            cache: false,
            success: function (html) {
                window.__pageCache[key] = html;
                preview.html(html);
            },
            error: function () {
                preview.html('<div style="padding:60px;text-align:center;color:#d70015;font-size:14px;">加载失败，请重试</div>');
            }
        });
    };

    __loadPage("main.html")

$.post("getMenu",function (data) {
    if (data == null || data == "" || data.code==-1) {
        window.location.href = "index.html";
    }
    setTimeout(function () {
        $.post("admin/index/checkUpdate",function (data) {
            if (data.code==1) {

                layer.confirm(data.msg, {
                    btn: ['去看看','算啦'],
                    title:"有更新啦"
                }, function(){
                    window.location.href = data.data;
                });

            }
        });
    },2000);


    console.log(data);
    var out_menu = "";
    for (var i = 0;i<data.length;i++){
        if (data[i].type=="menu"){
            out_menu+='<li class="layui-nav-item">';
            out_menu+='<a class="" href="javascript:;">'+data[i].name+'</a>';
            out_menu+='<dl class="layui-nav-child">';

            for (var ii = 0;ii<data[i].node.length;ii++){
                out_menu+='<dd><a onclick="__loadPage(\''+data[i].node[ii].url+'\')">'+data[i].node[ii].name+'</a></dd>';
            }
            out_menu+='</dl>';
            out_menu+='</li>';
        } else{
            out_menu+='<li class="layui-nav-item"><a onclick="__loadPage(\''+data[i].url+'\')">'+data[i].name+'</a></li>';
        }
    }
    console.log(out_menu);
    $("#v_menu").append(out_menu);
    if (layui.element)
        layui.element.render();


});
</script>
